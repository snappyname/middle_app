services:
  humiditysensor.api:
    build:
      context: ./HumiditySensor
      dockerfile: HumiditySensor.API/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:7080   
    ports:
      - "7080:7080"

  temperaturesensor.api:
    build:
      context: ./TemperatureSensor
      dockerfile: TemperatureSensor.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:9080
    ports:
      - "9080:9080"

  smartdoorsensor.api:
    build:
      context: ./SmartDoorSensor
      dockerfile: SmartDoorSensor.Api/Dockerfile
    ports:
      - "8080:8080"