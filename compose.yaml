services:
  humiditysensor.api:
    build:
      context: ./HumiditySensor
      dockerfile: HumiditySensor.API/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:7080   
    ports:
      - "7080:7080"

  temperaturesensor.api:
    build:
      context: ./TemperatureSensor
      dockerfile: TemperatureSensor.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:9080
    ports:
      - "9080:9080"

  smartdoorsensor.api:
    build:
      context: ./SmartDoorSensor
      dockerfile: SmartDoorSensor.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      HubApiUrl: "http://iot_hub.api:8000/api"

  iot_hub.api:
    build:
      context: ./iot_hub
      dockerfile: iot_hub.API/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8000   
      SensorsApi__Humidity: "http://humiditysensor.api:7080/api"
      SensorsApi__Temperature: "http://temperaturesensor.api:9080/api"
      SensorsApi__SmartDoor: "http://smartdoorsensor.api:8080/api"
      KafkaUrl: "kafka:9092"

  kafka:
    image: apache/kafka:4.3.0
    ports:
    - "9092:9092"
    - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
    - "7777:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
